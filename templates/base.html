<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Quantitativos RMT{% endblock %}</title>
    <script>
        // Carrega o tema imediatamente para evitar "flash" branco
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
    <style>
        {% block styles %}{% endblock %}
    </style>
</head>
<body>

<header>
    <h1><a href="/">Sistema de Quantitativos RMT</a></h1>
    <span>Redes de Média Tensão</span>
    {% if parque_ativo %}
    <div class="parque-seletor">
        <label for="hdr-parque">Parque</label>
        <select id="hdr-parque" onchange="trocarParqueAtivo(this.value)"
                title="Define de qual obra vêm as receitas de materiais e parafusos">
            {% for p in parques_resumo %}
            <option value="{{ p.id }}" {% if p.id == parque_ativo.id %}selected{% endif %}>{{ p.nome }}</option>
            {% endfor %}
        </select>
        <a class="gerir" href="/parques" title="Gerenciar parques">⚙</a>
    </div>
    {% endif %}
    
    <button id="theme-toggle" class="btn btn-outline" style="padding: 6px 10px; border: 1px solid var(--border-color); background: var(--bg-color); border-radius: var(--border-radius-sm); cursor: pointer; color: var(--text-main); font-size: 1.1rem; margin-left: {% if not parque_ativo %}auto{% else %}0{% endif %};" title="Alternar tema">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun" style="display: none;">☀️</span>
    </button>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<script>
// Troca o parque em uso e recarrega: as telas mostram dados do parque ativo,
// então continuar na página com os dados antigos seria enganoso.
async function trocarParqueAtivo(id) {
    const sel = document.getElementById('hdr-parque');
    sel.disabled = true;
    try {
        const r = await fetch('/parques/api/ativo', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: Number(id)})
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.erro || 'Falha ao trocar de parque.');
        location.reload();
    } catch (e) {
        sel.disabled = false;
        alert(e.message);
    }
}

// Lógica de alternância de tema (Dark Mode)
const themeToggle = document.getElementById('theme-toggle');
const iconMoon = themeToggle.querySelector('.icon-moon');
const iconSun = themeToggle.querySelector('.icon-sun');

function updateThemeIcon() {
    if (document.documentElement.getAttribute('data-theme') === 'dark') {
        iconMoon.style.display = 'none';
        iconSun.style.display = 'inline';
    } else {
        iconMoon.style.display = 'inline';
        iconSun.style.display = 'none';
    }
}

themeToggle.addEventListener('click', () => {
    if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
    } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
    }
    updateThemeIcon();
});

// Executa na inicialização para ajustar o ícone
updateThemeIcon();
</script>

{% block scripts %}{% endblock %}

</body>
</html>
