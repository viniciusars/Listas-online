<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Quantitativos RMT{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        header {
            background: #1a2744;
            color: white;
            padding: 18px 40px;
            display: flex;
            align-items: baseline;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
        header h1 a { color: inherit; text-decoration: none; }
        header > span { font-size: 0.82rem; opacity: 0.5; }

        /* ---- Seletor de parque (contexto de todas as telas) ---- */
        .parque-seletor {
            margin-left: auto;
            align-self: center;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .parque-seletor label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.5;
        }
        .parque-seletor select {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 0.83rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            max-width: 240px;
        }
        .parque-seletor select:focus {
            outline: none;
            border-color: rgba(255,255,255,0.6);
        }
        /* sem isto o dropdown nativo do Windows renderiza branco sobre branco */
        .parque-seletor select option { color: #1e293b; background: white; }
        .parque-seletor a.gerir {
            color: rgba(255,255,255,0.55);
            text-decoration: none;
            font-size: 0.95rem;
            line-height: 1;
            padding: 5px 6px;
            border-radius: 5px;
        }
        .parque-seletor a.gerir:hover { color: white; background: rgba(255,255,255,0.12); }

        main {
            max-width: 840px;
            margin: 36px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Breadcrumb / voltar */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: -4px;
        }
        .back-link:hover { color: #2563eb; }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            overflow: hidden;
        }

        .card-header {
            padding: 13px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step {
            background: #1a2744;
            color: white;
            width: 22px; height: 22px;
            border-radius: 50%;
            font-size: 0.72rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-header h2 { font-size: 0.92rem; font-weight: 600; }

        .card-body { padding: 18px 20px; }

        /* ---- Menu inicial (cards de navegação) ---- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
        }

        .menu-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            padding: 28px 24px;
            text-decoration: none;
            color: #1e293b;
            border: 1.5px solid transparent;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 6px 18px rgba(37,99,235,0.12);
            transform: translateY(-2px);
        }

        .menu-icon { font-size: 2.2rem; }
        .menu-card h2 { font-size: 1.05rem; font-weight: 700; }
        .menu-card p { font-size: 0.85rem; color: #64748b; line-height: 1.5; }
        .menu-card .tag-soon {
            align-self: flex-start;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #b45309;
            background: #fef3c7;
            padding: 2px 8px;
            border-radius: 99px;
            margin-top: 2px;
        }

        /* ---- Botões ---- */
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.87rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-add { background: #e2e8f0; color: #334155; }
        .btn-add:hover { background: #cbd5e1; }

        /* ---- Spinner ---- */
        .spinner {
            display: inline-block;
            width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        {% block styles %}{% endblock %}
    </style>
</head>
<body>

<header>
    <h1><a href="/">Sistema de Quantitativos RMT</a></h1>
    <span>Redes de Média Tensão</span>
    {% if parque_ativo %}
    <div class="parque-seletor">
        <label for="hdr-parque">Parque</label>
        <select id="hdr-parque" onchange="trocarParqueAtivo(this.value)"
                title="Define de qual obra vêm as receitas de materiais e parafusos">
            {% for p in parques_resumo %}
            <option value="{{ p.id }}" {% if p.id == parque_ativo.id %}selected{% endif %}>{{ p.nome }}</option>
            {% endfor %}
        </select>
        <a class="gerir" href="/parques" title="Gerenciar parques">⚙</a>
    </div>
    {% endif %}
</header>

<main>
    {% block content %}{% endblock %}
</main>

<script>
// Troca o parque em uso e recarrega: as telas mostram dados do parque ativo,
// então continuar na página com os dados antigos seria enganoso.
async function trocarParqueAtivo(id) {
    const sel = document.getElementById('hdr-parque');
    sel.disabled = true;
    try {
        const r = await fetch('/parques/api/ativo', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: Number(id)})
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.erro || 'Falha ao trocar de parque.');
        location.reload();
    } catch (e) {
        sel.disabled = false;
        alert(e.message);
    }
}
</script>

{% block scripts %}{% endblock %}

</body>
</html>
